# MCP Distributed Infrastructure — Server Registry
# Names MUST match exactly the keys in agent JSON files (mcpServers.*)

machines:
  envy:
    host: localhost
    description: "WSL sur ENVY — agent client + serveurs avec dépendances locales"
  csben:
    host: 192.168.2.55
    description: "Serveurs API-only (Internet + tokens)"
    base_port: 3100
  pcalt:
    host: 192.168.2.56
    description: "Serveurs AWS + communication"
    base_port: 3200

servers:
  # === LOCAL (doivent rester sur WSL) ===
  memory:
    target: envy
    reason: "Fichier JSON local"
  time:
    target: envy
    reason: "Quasi zéro ressources"
  excel:
    target: envy
    reason: "Accès fichiers .xlsx locaux"
  bookmarks:
    target: envy
    reason: "Lit fichiers Chrome/Edge locaux"
  pdf-reader:
    target: envy
    reason: "Lit fichiers PDF locaux"
  fetch:
    target: envy
    reason: "Léger, pas de dépendance externe lourde"

  # === CSBEN (API-only, Internet) ===
  context7:
    target: csben
    port_offset: 0
  firecrawl:
    target: csben
    port_offset: 1
  mcp-mermaid:
    target: csben
    port_offset: 2
  youtube-transcript:
    target: csben
    port_offset: 3
  notebooklm:
    target: csben
    port_offset: 4
  sequential-thinking:
    target: csben
    port_offset: 5
  airtable:
    target: csben
    port_offset: 6

  # === PCALT (AWS + Communication) ===
  telegram:
    target: pcalt
    port_offset: 0
  ticktick:
    target: pcalt
    port_offset: 1
  github:
    target: pcalt
    port_offset: 2
  gmail:
    target: pcalt
    port_offset: 3
  notion-workspace:
    target: pcalt
    port_offset: 4
  awslabs.aws-api-mcp-server:
    target: pcalt
    port_offset: 5
  awslabs.eks-mcp-server:
    target: pcalt
    port_offset: 6
