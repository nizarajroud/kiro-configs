# MCP Distributed Infrastructure — Server Registry
# Names MUST match exactly the keys in agent JSON files (mcpServers.*)
# Source of truth for PLACEMENT only. Configs (command, args, env) live in agent JSON.

machines:
  envy:
    host: localhost
    description: "WSL sur ENVY — agent client + serveurs avec dépendances locales"
  pcalt:
    host: 192.168.2.56
    ssh_port: 2222
    ssh_user: nizar
    description: "PC Alithya — serveurs remote via supergateway"
    base_port: 3200

servers:
  # === LOCAL (doivent rester sur WSL) ===
  memory:
    target: envy
    reason: "Fichier JSON local"
  time:
    target: envy
    reason: "Quasi zéro ressources"
  excel:
    target: envy
    reason: "Accès fichiers .xlsx locaux"
  bookmarks:
    target: envy
    reason: "Lit fichiers Chrome/Edge locaux"
  pdf-reader:
    target: envy
    reason: "Lit fichiers PDF locaux"
  fetch:
    target: envy
    reason: "Léger, pas de dépendance externe lourde"

  # === PCALT (remote via supergateway) ===
  context7:
    target: pcalt
    port_offset: 0
  firecrawl:
    target: pcalt
    port_offset: 1
  mcp-mermaid:
    target: pcalt
    port_offset: 2
  youtube-transcript:
    target: pcalt
    port_offset: 3
  notebooklm:
    target: pcalt
    port_offset: 4
  sequential-thinking:
    target: pcalt
    port_offset: 5
  airtable:
    target: pcalt
    port_offset: 6
  telegram:
    target: pcalt
    port_offset: 7
  ticktick:
    target: pcalt
    port_offset: 8
  github:
    target: pcalt
    port_offset: 9
  gmail:
    target: pcalt
    port_offset: 10
  notion-workspace:
    target: pcalt
    port_offset: 11
  awslabs.aws-api-mcp-server:
    target: pcalt
    port_offset: 12
  awslabs.eks-mcp-server:
    target: pcalt
    port_offset: 13
