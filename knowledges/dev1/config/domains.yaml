# Dev1 Domain Taxonomy

domains:
  gitlab:
    label: "GitLab"
    keywords: [GitLab, merge request, pipeline, Alithya, CSNA, beneva-int, CI/CD]

  github-docs:
    label: "GitHub Repo Docs"
    keywords: [repo GitHub, README, documentation repo, git-mcp]

  sdk-docs:
