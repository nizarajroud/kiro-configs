<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiro Web</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --sidebar: #f9f9fa; --border: #e5e5e6;
    --text: #1f2328; --muted: #6b7280; --accent: #0969da;
    --user: #0969da; --assistant: #ffffff; --hover: #ececed; --active: #e3e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }

  /* ===== Sidebar ===== */
  #sidebar {
    width: 280px; min-width: 280px; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%;
    transition: width 0.18s ease, min-width 0.18s ease;
  }
  body.sb-collapsed #sidebar { width: 0; min-width: 0; overflow: hidden; border-right: none; }
  #sidebar .top { padding: 12px; border-bottom: 1px solid var(--border); }
  #new-chat {
    width: 100%; display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 0.9rem; cursor: pointer; font-weight: 500;
  }
  #new-chat:hover { opacity: 0.92; }
  .sb-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 14px 14px 4px; }
  #session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .date-group { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 8px 4px; font-weight: 600; }
  .session-item {
    padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
    display: flex; align-items: center; gap: 8px; position: relative;
  }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active); }
  .agent-badge {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .session-item .s-body { flex: 1; min-width: 0; }
  .session-item .s-title { font-size: 0.85rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-empty { padding: 14px; color: var(--muted); font-size: 0.82rem; font-style: italic; }
  #collapse-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); cursor: pointer; padding: 4px 9px; font-size: 0.9rem;
  }
  #collapse-btn:hover { background: var(--hover); }

  /* ===== Main ===== */
  #main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
  header {
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; gap: 12px; font-size: 0.9rem;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #d1242f; }
  header .dot.ready { background: #1a7f37; }
  header select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 0.88rem; font-weight: 500;
  }
  header .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 0.8rem; }

  #chat { flex: 1; overflow-y: auto; padding: 24px 40px; }
  .empty-hint { color: var(--muted); text-align: center; margin-top: 15vh; font-size: 0.95rem; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg .role { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg .bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.55; overflow-x: auto; }
  .msg.user .bubble { background: var(--user); color: #fff; align-self: flex-start; }
  .msg.assistant .bubble { background: var(--assistant); border: 1px solid var(--border); }
  .msg.error .bubble { background: #ffebe9; border: 1px solid #cf222e; color: #cf222e; }
  .msg .bubble p:first-child { margin-top: 0; }
  .msg .bubble p:last-child { margin-bottom: 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.88rem; }
  .bubble th { background: var(--accent); color: #fff; padding: 8px 12px; text-align: left; }
  .bubble td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .bubble tr:nth-child(even) { background: #f6f8fa; }
  .bubble pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .bubble code { font-family: 'SF Mono', Menlo, monospace; font-size: 0.85rem; }
  .bubble :not(pre) > code { background: rgba(175,184,193,0.3); padding: 2px 6px; border-radius: 4px; }
  .bubble a { color: var(--accent); }
  .tool-note { font-size: 0.78rem; color: var(--muted); font-style: italic; margin: 4px 0; }
  /* Typing / thinking indicator */
  .thinking { display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--muted); font-size: 0.85rem; }
  .thinking .dots { display: inline-flex; gap: 4px; }
  .thinking .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: think 1.2s infinite ease-in-out;
  }
  .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes think { 0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

  footer { padding: 14px 40px 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; resize: none; font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-size: 0.95rem; cursor: pointer; font-weight: 500;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="top">
      <button id="new-chat">✏️ Nouveau chat</button>
    </div>
    <div class="sb-label">Sessions (24h)</div>
    <div id="session-list"></div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <header>
      <button id="collapse-btn" title="Replier/déplier la sidebar">☰</button>
      <span class="dot" id="conn-dot"></span>
      <strong>Kiro</strong>
      <select id="agent-select" title="Agent">
        <option value="exp2">exp2</option>
        <option value="compass">compass</option>
        <option value="forge">forge</option>
        <option value="light">light</option>
        <option value="it-supervisor">it-supervisor</option>
      </select>
      <span class="spacer"></span>
      <span id="status">Choisis un agent, puis une session à gauche (ou ✏️ Nouveau chat)</span>
    </header>

    <div id="chat">
      <div class="empty-hint" id="empty-hint">Sélectionne une session à gauche ou démarre un nouveau chat.</div>
    </div>

    <footer>
      <textarea id="input" rows="1" placeholder="Pose ta question… (Entrée = envoyer, Shift+Entrée = nouvelle ligne)" disabled></textarea>
      <button id="send" disabled>Envoyer</button>
    </footer>
  </div>

<script>
  marked.setOptions({
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    },
    breaks: true, gfm: true,
  });

  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const dot = document.getElementById('conn-dot');
  const agentSelect = document.getElementById('agent-select');
  const sessionList = document.getElementById('session-list');
  const newChatBtn = document.getElementById('new-chat');

  let ws = null, currentAssistantEl = null, currentAssistantRaw = '', ready = false;
  let intentionalClose = false;   // true when WE close the WS (session switch), to skip auto-reconnect
  let reconnectTimer = null;      // pending auto-reconnect timeout
  let streaming = false;          // true while a response is being streamed
  let resumeSessionId = '';       // '' = new session
  let activeSessionId = '';       // currently displayed session (for sidebar highlight)
  let allSessions = [];           // full list from /api/sessions

  // Input stays enabled whenever the session is ready (so you can type your next
  // question during streaming). Only the SEND action is gated while streaming.
  function updateSendState() {
    input.disabled = !ready;
    sendBtn.disabled = !ready || streaming;
    if (ready) input.focus();
  }

  // Auto-scroll only if the user is already near the bottom — so you can scroll up
  // to read previous messages while a response is still streaming.
  function isNearBottom() {
    return (chat.scrollHeight - chat.scrollTop - chat.clientHeight) < 120;
  }
  function maybeScroll(force) {
    if (force || isNearBottom()) chat.scrollTop = chat.scrollHeight;
  }

  // Thinking indicator (animated dots) shown between sending and first response chunk.
  let thinkingEl = null;
  function showThinking() {
    hideThinking();
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking';
    thinkingEl.innerHTML = `${agentSelect.value} réfléchit <span class="dots"><span></span><span></span><span></span></span>`;
    chat.appendChild(thinkingEl);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  // ---------- Sidebar ----------
  async function loadSessions() {
    try {
      const res = await fetch('/api/sessions');
      const data = await res.json();
      allSessions = data.sessions || [];
    } catch (e) { allSessions = []; }
    renderSessions();
  }

  // Agent → couleur (badge dans la sidebar)
  const AGENT_COLORS = {
    exp2: '#0969da', compass: '#1a7f37', forge: '#bc4c00',
    light: '#8250df', 'it-supervisor': '#cf222e', media1: '#bf3989',
  };
  function agentColor(a) { return AGENT_COLORS[a] || '#6b7280'; }

  // Regroupement par date à partir du timestamp
  function dateGroup(ms) {
    const now = new Date();
    const d = new Date(ms);
    const sameDay = d.toDateString() === now.toDateString();
    const y = new Date(now); y.setDate(now.getDate() - 1);
    const isYesterday = d.toDateString() === y.toDateString();
    if (sameDay) return "Aujourd'hui";
    if (isYesterday) return 'Hier';
    return 'Plus ancien';
  }

  function renderSessions() {
    // Show ALL recent sessions (all agents). The colored badge distinguishes the agent.
    const filtered = allSessions.slice();
    sessionList.innerHTML = '';
    if (filtered.length === 0) {
      const d = document.createElement('div');
      d.className = 'sb-empty';
      d.textContent = 'Aucune session dans les dernières 24h.';
      sessionList.appendChild(d);
      return;
    }
    // Grouper par date (l'ordre est déjà date desc depuis le backend)
    let lastGroup = null;
    filtered.forEach(s => {
      const g = dateGroup(s.updated_ms);
      if (g !== lastGroup) {
        lastGroup = g;
        const gh = document.createElement('div');
        gh.className = 'date-group';
        gh.textContent = g;
        sessionList.appendChild(gh);
      }
      const item = document.createElement('div');
      item.className = 'session-item' + (s.session_id === activeSessionId ? ' active' : '');

      const badge = document.createElement('span');
      badge.className = 'agent-badge';
      badge.style.background = agentColor(s.agent);
      badge.title = s.agent;

      const body = document.createElement('div');
      body.className = 's-body';
      const title = document.createElement('div');
      title.className = 's-title';
      title.textContent = s.name;
      const meta = document.createElement('div');
      meta.className = 's-meta';
      const topicPart = (s.topic && s.topic !== '-') ? ` · ${s.topic}` : '';
      meta.textContent = `${s.date} · ${s.msgs} msgs${topicPart}`;
      body.appendChild(title); body.appendChild(meta);

      item.appendChild(badge); item.appendChild(body);
      item.addEventListener('click', () => openSession(s.session_id));
      sessionList.appendChild(item);
    });
  }

  // ---------- Session navigation ----------
  function openSession(sessionId) {
    resumeSessionId = sessionId;
    activeSessionId = sessionId;
    startConnection();
  }

  function newChat() {
    resumeSessionId = '';
    activeSessionId = '';
    startConnection();
  }

  function startConnection() {
    // Closing the current WS triggers the backend `finally` → post-session hooks
    // of the session we are leaving (parity with qq, hooks-on-switch).
    chat.innerHTML = '';
    ready = false; dot.classList.remove('ready');
    input.disabled = true; sendBtn.disabled = true;
    renderSessions();  // update highlight
    statusEl.textContent = resumeSessionId ? 'Reprise de session…' : 'Nouvelle session…';
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (ws) { intentionalClose = true; try { ws.close(); } catch (e) {} }
    connect();
  }

  // ---------- Chat rendering ----------

  // Detect AI-GENERATED file paths in rendered HTML and turn them into
  // inline images (png/svg/jpg…) or clickable links (.drawio/.d2 sources).
  // Handles both Windows (C:\...\AI-GENERATED\...) and WSL (/mnt/c/.../AI-GENERATED/...) paths.
  const _IMG_EXT = ['png', 'svg', 'jpg', 'jpeg', 'gif', 'webp'];
  const _SRC_EXT = ['drawio', 'd2', 'excalidraw', 'pdf', 'html'];

  function _aigenRelUrl(rawPath) {
    // Normalize backslashes, extract the part after AI-GENERATED/
    const p = rawPath.replace(/\\/g, '/');
    const idx = p.indexOf('AI-GENERATED/');
    if (idx === -1) return null;
    const rel = p.slice(idx + 'AI-GENERATED/'.length);
    return '/ai-generated/' + rel.split('/').map(encodeURIComponent).join('/');
  }

  function enrichAIGenerated(bubble) {
    // Match any AI-GENERATED path with a known extension inside the text.
    // e.g. C:\Users\nizar\Documents\AI-GENERATED\...\x.png  or /mnt/c/.../AI-GENERATED/.../x.svg
    const re = /([A-Za-z]:\\[^\s"'<>)\]]*AI-GENERATED\\[^\s"'<>)\]]+|\/[^\s"'<>)\]]*AI-GENERATED\/[^\s"'<>)\]]+)/g;
    const html = bubble.innerHTML;
    const seen = new Set();
    let m;
    const found = [];
    while ((m = re.exec(bubble.textContent)) !== null) {
      const path = m[1];
      if (seen.has(path)) continue;
      seen.add(path);
      found.push(path);
    }
    if (found.length === 0) return;

    found.forEach(path => {
      const url = _aigenRelUrl(path);
      if (!url) return;
      const ext = path.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '');
      const container = document.createElement('div');
      container.style.marginTop = '10px';
      if (_IMG_EXT.includes(ext)) {
        const img = document.createElement('img');
        img.src = url; img.alt = 'diagramme généré';
        img.style.maxWidth = '100%'; img.style.borderRadius = '8px';
        img.style.border = '1px solid var(--border)'; img.style.cursor = 'zoom-in';
        img.addEventListener('click', () => window.open(url, '_blank'));
        const link = document.createElement('a');
        link.href = url; link.target = '_blank'; link.textContent = '🔍 Ouvrir en plein écran';
        link.style.display = 'inline-block'; link.style.marginTop = '4px'; link.style.fontSize = '0.8rem';
        container.appendChild(img); container.appendChild(document.createElement('br')); container.appendChild(link);
        bubble.appendChild(container);
      } else if (_SRC_EXT.includes(ext)) {
        const link = document.createElement('a');
        link.href = url; link.target = '_blank';
        link.textContent = '📎 ' + path.split(/[\\/]/).pop() + ' (ouvrir)';
        link.style.fontSize = '0.85rem';
        container.appendChild(link);
        bubble.appendChild(container);
      }
    });
  }

  function addMsg(role, textOrHtml, isMarkdown = false) {
    const hint = document.getElementById('empty-hint');
    if (hint) hint.remove();
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.textContent = role === 'user' ? 'Vous' : (role === 'error' ? 'Erreur' : agentSelect.value);
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (isMarkdown) {
      bubble.innerHTML = marked.parse(textOrHtml);
      // Open all links in a new tab (don't lose the web session)
      bubble.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
      enrichAIGenerated(bubble);
    }
    else bubble.textContent = textOrHtml;
    msg.appendChild(roleEl); msg.appendChild(bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  // ---------- WebSocket ----------
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      intentionalClose = false;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      const payload = { agent: agentSelect.value };
      // On reconnect, resume the active session (activeSessionId) if any.
      const sid = resumeSessionId || activeSessionId;
      if (sid) payload.session_id = sid;
      ws.send(JSON.stringify(payload));
    };

    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'status') { statusEl.textContent = m.text; }
      else if (m.type === 'history') {
        addMsg(m.role === 'user' ? 'user' : 'assistant', m.text, m.role !== 'user');
      }
      else if (m.type === 'history_tool') {
        const note = document.createElement('div');
        note.className = 'tool-note'; note.textContent = '🔧 ' + m.title;
        chat.appendChild(note); chat.scrollTop = chat.scrollHeight;
      }
      else if (m.type === 'ready') {
        ready = true; streaming = false; dot.classList.add('ready');
        activeSessionId = m.session_id;
        const tag = m.resumed ? 'repris' : 'nouveau';
        statusEl.textContent = `Prêt · ${m.agent} · session ${m.session_id.slice(0,8)} (${tag})`;
        if (m.agent) agentSelect.value = m.agent;
        updateSendState();
        loadSessions();  // refresh sidebar (new session may appear)
      }
      else if (m.type === 'chunk') {
        hideThinking();
        if (!currentAssistantEl) { currentAssistantRaw = ''; currentAssistantEl = addMsg('assistant', '', true); }
        currentAssistantRaw += m.text;
        currentAssistantEl.innerHTML = marked.parse(currentAssistantRaw);
        currentAssistantEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        currentAssistantEl.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
        maybeScroll();  // only scroll if user is already at the bottom
      }
      else if (m.type === 'tool') {
        hideThinking();
        currentAssistantEl = null; currentAssistantRaw = '';
        const note = document.createElement('div');
        note.className = 'tool-note'; note.textContent = '🔧 ' + m.title;
        chat.appendChild(note); maybeScroll();
      }
      else if (m.type === 'done') {
        hideThinking();
        // Response complete → enrich the last assistant bubble with inline images/links
        if (currentAssistantEl) enrichAIGenerated(currentAssistantEl);
        currentAssistantEl = null; currentAssistantRaw = '';
        streaming = false; updateSendState();
      }
      else if (m.type === 'error') {
        hideThinking();
        addMsg('error', m.text); currentAssistantEl = null;
        streaming = false; updateSendState();
      }
    };

    ws.onclose = () => {
      dot.classList.remove('ready'); ready = false; streaming = false;
      input.disabled = true; sendBtn.disabled = true;
      // Auto-reconnect on unexpected close (F5, sleep, network, server restart),
      // but NOT when we closed it on purpose (session switch).
      if (!intentionalClose && (activeSessionId || resumeSessionId)) {
        statusEl.textContent = 'Connexion perdue — reconnexion…';
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => { connect(); }, 1500);
      }
    };
    ws.onerror = () => { statusEl.textContent = 'Erreur de connexion — reconnexion…'; };
  }

  function send() {
    const text = input.value.trim();
    if (!text || !ready || streaming) return;  // block send while streaming, but input stays usable
    addMsg('user', text);
    ws.send(JSON.stringify({ type: 'prompt', text }));
    input.value = ''; input.style.height = 'auto';
    streaming = true;
    showThinking();      // show "… réfléchit" until first chunk/tool arrives
    updateSendState();   // keeps input enabled + focused, disables only the Send button
  }

  // ---------- Events ----------
  sendBtn.onclick = send;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });
  // Agent dropdown = agent for the NEXT "Nouveau chat". Does not filter the list.
  agentSelect.addEventListener('change', () => { /* no-op: sidebar shows all sessions */ });
  newChatBtn.addEventListener('click', newChat);
  document.getElementById('collapse-btn').addEventListener('click', () => {
    document.body.classList.toggle('sb-collapsed');
  });

  // Reconnect when the page becomes visible again (back navigation, wake from sleep)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'
        && (activeSessionId || resumeSessionId)
        && (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING)) {
      connect();
    }
  });

  // ---------- Auto-focus: keep the cursor in the input, always ----------
  function refocus() {
    if (!input.disabled) input.focus();
  }
  // Refocus when clicking anywhere that is NOT an interactive control
  // (so clicking a session/agent/button still works, but clicking empty space refocuses).
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t.closest('button, select, a, .session-item, textarea, input')) return;
    setTimeout(refocus, 0);
  });
  // Refocus when the tab/window regains focus
  window.addEventListener('focus', refocus);
  // Refocus after any key press outside the input (e.g. you start typing)
  document.addEventListener('keydown', (e) => {
    if (document.activeElement !== input && !input.disabled &&
        !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) {
      input.focus();
    }
  });

  // ---------- Init ----------
  loadSessions();
</script>
</body>
</html>
