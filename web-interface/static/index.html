<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiro Web</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --sidebar: #f9f9fa; --border: #e5e5e6;
    --text: #1f2328; --muted: #6b7280; --accent: #0969da;
    --user: #0969da; --assistant: #ffffff; --hover: #ececed; --active: #e3e8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }

  /* ===== Sidebar ===== */
  #sidebar {
    width: 280px; min-width: 280px; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%;
    transition: width 0.18s ease, min-width 0.18s ease;
  }
  body.sb-collapsed #sidebar { width: 0; min-width: 0; overflow: hidden; border-right: none; }
  #sidebar .top { padding: 12px; border-bottom: 1px solid var(--border); }
  #new-chat {
    width: 100%; display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 0.9rem; cursor: pointer; font-weight: 500;
  }
  #new-chat:hover { opacity: 0.92; }
  .sb-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 14px 14px 4px; }
  #session-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .date-group { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 8px 4px; font-weight: 600; }
  .session-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
  .session-item:hover { background: var(--hover); }
  .session-item.open { background: var(--active); }
  .agent-badge { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .session-item .s-body { flex: 1; min-width: 0; }
  .session-item .s-title { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-empty { padding: 14px; color: var(--muted); font-size: 0.82rem; font-style: italic; }
  #collapse-btn { background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 4px 9px; font-size: 0.9rem; }
  #collapse-btn:hover { background: var(--hover); }

  /* ===== Main ===== */
  #main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
  header {
    padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; gap: 12px; font-size: 0.9rem;
  }
  header select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 0.88rem; font-weight: 500; }
  header .spacer { flex: 1; }
  #status { color: var(--muted); font-size: 0.8rem; }

  /* ===== Tab bar ===== */
  #tabbar {
    display: flex; align-items: center; gap: 2px; padding: 6px 12px 0; background: var(--panel);
    border-bottom: 1px solid var(--border); overflow-x: auto; min-height: 40px;
  }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px; cursor: pointer;
    background: var(--sidebar); border: 1px solid var(--border); border-bottom: none;
    border-radius: 8px 8px 0 0; font-size: 0.82rem; max-width: 220px; white-space: nowrap;
    color: var(--muted);
  }
  .tab.active { background: var(--bg); color: var(--text); font-weight: 500; }
  .tab .tab-title { overflow: hidden; text-overflow: ellipsis; }
  .tab .tab-state { font-size: 0.7rem; flex-shrink: 0; }
  .tab .tab-close { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.95rem; padding: 0 2px; border-radius: 4px; flex-shrink: 0; }
  .tab .tab-close:hover { background: var(--hover); color: var(--text); }
  #tabbar-empty { color: var(--muted); font-size: 0.82rem; font-style: italic; padding: 8px; }

  /* ===== Chat panes (one per tab) ===== */
  #panes { flex: 1; position: relative; overflow: hidden; }
  .pane { position: absolute; inset: 0; overflow-y: auto; padding: 24px 40px; display: none; }
  .pane.active { display: block; }
  .empty-hint { color: var(--muted); text-align: center; margin-top: 15vh; font-size: 0.95rem; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg .role { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg .bubble { padding: 12px 16px; border-radius: 10px; line-height: 1.55; overflow-x: auto; }
  .msg.user .bubble { background: var(--user); color: #fff; align-self: flex-start; }
  .msg.assistant .bubble { background: var(--assistant); border: 1px solid var(--border); }
  .msg.error .bubble { background: #ffebe9; border: 1px solid #cf222e; color: #cf222e; }
  .msg .bubble p:first-child { margin-top: 0; } .msg .bubble p:last-child { margin-bottom: 0; }
  .bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.88rem; }
  .bubble th { background: var(--accent); color: #fff; padding: 8px 12px; text-align: left; }
  .bubble td { padding: 7px 12px; border-bottom: 1px solid var(--border); }
  .bubble tr:nth-child(even) { background: #f6f8fa; }
  .bubble pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .bubble code { font-family: 'SF Mono', Menlo, monospace; font-size: 0.85rem; }
  .bubble :not(pre) > code { background: rgba(175,184,193,0.3); padding: 2px 6px; border-radius: 4px; }
  .bubble a { color: var(--accent); }
  .tool-note { font-size: 0.78rem; color: var(--muted); font-style: italic; margin: 4px 0; }
  .thinking { display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--muted); font-size: 0.85rem; }
  .thinking .dots { display: inline-flex; gap: 4px; }
  .thinking .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: think 1.2s infinite ease-in-out; }
  .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes think { 0%,80%,100% { opacity: 0.25; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

  footer { padding: 14px 40px 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; resize: none; font-family: inherit; }
  #input:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px; font-size: 0.95rem; cursor: pointer; font-weight: 500; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #send.stop { background: #cf222e; }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="top"><button id="new-chat">✏️ Nouveau chat</button></div>
    <div class="sb-label">Sessions (24h)</div>
    <div id="session-list"></div>
  </aside>

  <div id="main">
    <header>
      <button id="collapse-btn" title="Replier/déplier la sidebar">☰</button>
      <strong>Kiro</strong>
      <select id="agent-select" title="Agent du prochain nouveau chat">
        <option value="exp2">exp2</option>
        <option value="compass">compass</option>
        <option value="forge">forge</option>
        <option value="light">light</option>
        <option value="it-supervisor">it-supervisor</option>
      </select>
      <span class="spacer"></span>
      <span id="status">Ouvre une session à gauche (nouvel onglet) ou ✏️ Nouveau chat</span>
    </header>

    <div id="tabbar"><span id="tabbar-empty">Aucun onglet ouvert</span></div>
    <div id="panes"></div>

    <footer>
      <textarea id="input" rows="1" placeholder="Pose ta question… (Entrée = envoyer, Shift+Entrée = nouvelle ligne)" disabled></textarea>
      <button id="send" disabled>Envoyer</button>
    </footer>
  </div>

<script>
  marked.setOptions({
    highlight: (code, lang) => {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
      return hljs.highlightAuto(code).value;
    }, breaks: true, gfm: true,
  });

  const MAX_HOT = 4;   // number of "hot" tabs (live kiro-cli acp subprocess)

  const sidebar = document.getElementById('sidebar');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const agentSelect = document.getElementById('agent-select');
  const sessionList = document.getElementById('session-list');
  const newChatBtn = document.getElementById('new-chat');
  const tabbar = document.getElementById('tabbar');
  const panes = document.getElementById('panes');

  let allSessions = [];
  let tabs = [];            // array of Tab objects (order = tab bar order)
  let activeTabId = null;   // uid of the active tab
  let lru = [];             // uids ordered by recent use (front = most recent)
  let tabSeq = 0;

  // Tab = { uid, sessionId|null, agent, title, state:'hot'|'warm', ws, ready, streaming,
  //         pane(DOM), curEl, curRaw, thinkEl, wantSid(for resume), intentionalClose, reconnectTimer }

  const AGENT_COLORS = { exp2:'#0969da', compass:'#1a7f37', forge:'#bc4c00', light:'#8250df', 'it-supervisor':'#cf222e', media1:'#bf3989' };
  const agentColor = a => AGENT_COLORS[a] || '#6b7280';

  // ---------- Sidebar ----------
  async function loadSessions() {
    try { allSessions = (await (await fetch('/api/sessions')).json()).sessions || []; }
    catch (e) { allSessions = []; }
    renderSessions();
  }
  function dateGroup(ms) {
    const now = new Date(), d = new Date(ms);
    if (d.toDateString() === now.toDateString()) return "Aujourd'hui";
    const y = new Date(now); y.setDate(now.getDate()-1);
    if (d.toDateString() === y.toDateString()) return 'Hier';
    return 'Plus ancien';
  }
  function renderSessions() {
    sessionList.innerHTML = '';
    if (allSessions.length === 0) {
      sessionList.innerHTML = '<div class="sb-empty">Aucune session dans les dernières 24h.</div>'; return;
    }
    const openSids = new Set(tabs.map(t => t.sessionId).filter(Boolean));
    let lastGroup = null;
    allSessions.forEach(s => {
      const g = dateGroup(s.updated_ms);
      if (g !== lastGroup) { lastGroup = g; const gh = document.createElement('div'); gh.className='date-group'; gh.textContent=g; sessionList.appendChild(gh); }
      const item = document.createElement('div');
      item.className = 'session-item' + (openSids.has(s.session_id) ? ' open' : '');
      const badge = document.createElement('span'); badge.className='agent-badge'; badge.style.background=agentColor(s.agent); badge.title=s.agent;
      const body = document.createElement('div'); body.className='s-body';
      const title = document.createElement('div'); title.className='s-title'; title.textContent=s.name;
      const meta = document.createElement('div'); meta.className='s-meta';
      const topicPart = (s.topic && s.topic !== '-') ? ` · ${s.topic}` : '';
      meta.textContent = `${s.date} · ${s.msgs} msgs${topicPart}`;
      body.appendChild(title); body.appendChild(meta);
      item.appendChild(badge); item.appendChild(body);
      item.addEventListener('click', () => openSessionInTab(s.session_id, s.agent));
      sessionList.appendChild(item);
    });
  }

  // ---------- Tabs ----------
  function findTabBySid(sid) { return tabs.find(t => t.sessionId === sid); }
  function getTab(uid) { return tabs.find(t => t.uid === uid); }

  function touchLru(uid) { lru = [uid, ...lru.filter(x => x !== uid)]; }

  function openSessionInTab(sid, agent) {
    const existing = findTabBySid(sid);
    if (existing) { activateTab(existing.uid); return; }
    createTab({ sessionId: sid, agent: agent || agentSelect.value, wantSid: sid });
  }
  function newChat() {
    createTab({ sessionId: null, agent: agentSelect.value, wantSid: null });
  }

  function createTab({ sessionId, agent, wantSid }) {
    const uid = 'tab' + (++tabSeq);
    const pane = document.createElement('div');
    pane.className = 'pane';
    pane.innerHTML = '<div class="empty-hint">Connexion…</div>';
    panes.appendChild(pane);
    const tab = {
      uid, sessionId, agent, title: sessionId ? shortTitle(sessionId, agent) : `Nouveau (${agent})`,
      state: 'warm', ws: null, ready: false, streaming: false,
      pane, curEl: null, curRaw: '', thinkEl: null, wantSid,
      intentionalClose: false, reconnectTimer: null,
    };
    tabs.push(tab);
    renderTabs();
    activateTab(uid);        // activate first (shows pane)
    makeHot(tab);            // then connect (respects LRU eviction)
  }

  function shortTitle(sid, agent) {
    const s = allSessions.find(x => x.session_id === sid);
    if (s) return s.name;
    return (agent || 'session') + ' · ' + sid.slice(0, 6);
  }

  function activateTab(uid) {
    activeTabId = uid;
    touchLru(uid);
    tabs.forEach(t => t.pane.classList.toggle('active', t.uid === uid));
    renderTabs();
    const tab = getTab(uid);
    if (tab) {
      // A warm tab becomes hot again when activated (so you can type immediately)
      if (tab.state === 'warm' && !tab.ws) makeHot(tab);
      syncInputForActive();
      renderSessions();  // update sidebar "open" highlight
    }
  }

  function closeTab(uid) {
    const tab = getTab(uid);
    if (!tab) return;
    // Closing = post-session hooks (via WS close) + drop the tab
    if (tab.ws) { tab.intentionalClose = false; try { tab.ws.close(); } catch (e) {} }
    if (tab.reconnectTimer) clearTimeout(tab.reconnectTimer);
    tab.pane.remove();
    tabs = tabs.filter(t => t.uid !== uid);
    lru = lru.filter(x => x !== uid);
    if (activeTabId === uid) {
      activeTabId = null;
      const next = lru.find(x => getTab(x));
      if (next) activateTab(next);
      else { renderTabs(); syncInputForActive(); }
    } else {
      renderTabs();
    }
    renderSessions();
  }

  function renderTabs() {
    const emptyEl = document.getElementById('tabbar-empty');
    tabbar.innerHTML = '';
    if (tabs.length === 0) { tabbar.appendChild(emptyEl); return; }
    tabs.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.uid === activeTabId ? ' active' : '');
      const state = document.createElement('span'); state.className='tab-state';
      state.textContent = t.state === 'hot' ? '🟢' : '🟡';
      state.title = t.state === 'hot' ? 'Chaud (prêt)' : 'Tiède (reconnexion au 1er message)';
      const title = document.createElement('span'); title.className='tab-title'; title.textContent = t.title;
      const close = document.createElement('button'); close.className='tab-close'; close.textContent='×'; close.title='Fermer';
      close.addEventListener('click', (e) => { e.stopPropagation(); closeTab(t.uid); });
      el.appendChild(state); el.appendChild(title); el.appendChild(close);
      el.addEventListener('click', () => activateTab(t.uid));
      tabbar.appendChild(el);
    });
  }

  // ---------- Hot/Warm pool (LRU) ----------
  function hotTabs() { return tabs.filter(t => t.state === 'hot'); }

  function makeHot(tab) {
    if (tab.state === 'hot' && tab.ws) return;
    // Evict least-recently-used hot tab if pool is full
    const hots = hotTabs();
    if (hots.length >= MAX_HOT) {
      // find the LRU among hot tabs that is NOT this tab
      const evictUid = [...lru].reverse().find(uid => {
        const t = getTab(uid); return t && t.state === 'hot' && t.uid !== tab.uid;
      });
      if (evictUid) makeWarm(getTab(evictUid));
    }
    tab.state = 'hot';
    connectTab(tab);
    renderTabs();
  }

  function makeWarm(tab) {
    tab.state = 'warm';
    tab.ready = false; tab.streaming = false;
    if (tab.ws) { tab.intentionalClose = true; try { tab.ws.close(); } catch (e) {} tab.ws = null; }
    if (tab.reconnectTimer) { clearTimeout(tab.reconnectTimer); tab.reconnectTimer = null; }
    renderTabs();
    if (tab.uid === activeTabId) syncInputForActive();
  }

  // ---------- WebSocket per tab ----------
  function connectTab(tab) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);
    tab.ws = ws;
    ws.onopen = () => {
      tab.intentionalClose = false;
      if (tab.reconnectTimer) { clearTimeout(tab.reconnectTimer); tab.reconnectTimer = null; }
      const payload = { agent: tab.agent };
      const sid = tab.wantSid || tab.sessionId;
      if (sid) payload.session_id = sid;
      ws.send(JSON.stringify(payload));
    };
    ws.onmessage = (ev) => handleTabMessage(tab, JSON.parse(ev.data));
    ws.onclose = () => {
      tab.ready = false; tab.streaming = false;
      if (tab.uid === activeTabId) syncInputForActive();
      // auto-reconnect only if still hot and not an intentional close
      if (!tab.intentionalClose && tab.state === 'hot') {
        if (tab.reconnectTimer) clearTimeout(tab.reconnectTimer);
        tab.reconnectTimer = setTimeout(() => { if (tab.state === 'hot') connectTab(tab); }, 1500);
      }
    };
    ws.onerror = () => {};
  }

  function handleTabMessage(tab, m) {
    if (m.type === 'status') { if (tab.uid === activeTabId) statusEl.textContent = m.text; }
    else if (m.type === 'history') { addMsgTab(tab, m.role === 'user' ? 'user' : 'assistant', m.text, m.role !== 'user', true); }
    else if (m.type === 'history_tool') { addToolTab(tab, m.title, true); }
    else if (m.type === 'ready') {
      tab.ready = true; tab.streaming = false; tab.sessionId = m.session_id;
      if (m.agent) tab.agent = m.agent;
      tab.wantSid = null;
      tab.title = shortTitle(m.session_id, tab.agent);
      // clear the "Connexion…" hint on first ready if pane only had the hint
      const hint = tab.pane.querySelector('.empty-hint'); if (hint && tab.pane.children.length === 1) hint.remove();
      renderTabs();
      if (tab.uid === activeTabId) { statusEl.textContent = `Prêt · ${tab.agent} · ${m.session_id.slice(0,8)}`; syncInputForActive(); }
      loadSessions();
    }
    else if (m.type === 'chunk') {
      hideThinkingTab(tab);
      if (!tab.curEl) { tab.curRaw=''; tab.curEl = addMsgTab(tab, 'assistant', '', true, false); }
      tab.curRaw += m.text;
      tab.curEl.innerHTML = marked.parse(tab.curRaw);
      tab.curEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
      tab.curEl.querySelectorAll('a').forEach(a => { a.target='_blank'; a.rel='noopener noreferrer'; });
      maybeScrollTab(tab);
    }
    else if (m.type === 'tool') { hideThinkingTab(tab); tab.curEl=null; tab.curRaw=''; addToolTab(tab, m.title, false); }
    else if (m.type === 'done') {
      hideThinkingTab(tab);
      if (tab.curEl) enrichAIGenerated(tab.curEl);
      tab.curEl=null; tab.curRaw='';
      tab.streaming=false; if (tab.uid === activeTabId) syncInputForActive();
    }
    else if (m.type === 'error') {
      hideThinkingTab(tab);
      addMsgTab(tab, 'error', m.text, false, false); tab.curEl=null;
      tab.streaming=false; if (tab.uid === activeTabId) syncInputForActive();
    }
    else if (m.type === 'cancelled') {
      hideThinkingTab(tab);
      if (tab.curEl) enrichAIGenerated(tab.curEl);
      tab.curEl=null; tab.curRaw='';
      const note = document.createElement('div'); note.className='tool-note'; note.textContent='⏹ Interrompu';
      tab.pane.appendChild(note);
      tab.streaming=false; if (tab.uid === activeTabId) syncInputForActive();
    }
  }

  // ---------- Rendering helpers (per tab pane) ----------
  function addMsgTab(tab, role, textOrHtml, isMarkdown, isHistory) {
    const hint = tab.pane.querySelector('.empty-hint'); if (hint) hint.remove();
    const msg = document.createElement('div'); msg.className = 'msg ' + role;
    const roleEl = document.createElement('div'); roleEl.className='role';
    roleEl.textContent = role === 'user' ? 'Vous' : (role === 'error' ? 'Erreur' : tab.agent);
    const bubble = document.createElement('div'); bubble.className='bubble';
    if (isMarkdown) {
      bubble.innerHTML = marked.parse(textOrHtml);
      bubble.querySelectorAll('a').forEach(a => { a.target='_blank'; a.rel='noopener noreferrer'; });
      bubble.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
      enrichAIGenerated(bubble);
    } else bubble.textContent = textOrHtml;
    msg.appendChild(roleEl); msg.appendChild(bubble);
    tab.pane.appendChild(msg);
    maybeScrollTab(tab, role === 'user' || isHistory);
    return bubble;
  }
  function addToolTab(tab, title, isHistory) {
    const note = document.createElement('div'); note.className='tool-note'; note.textContent='🔧 '+title;
    tab.pane.appendChild(note); maybeScrollTab(tab, isHistory);
  }
  function showThinkingTab(tab) {
    hideThinkingTab(tab);
    const el = document.createElement('div'); el.className='thinking';
    el.innerHTML = `${tab.agent} réfléchit <span class="dots"><span></span><span></span><span></span></span>`;
    tab.pane.appendChild(el); tab.thinkEl = el; tab.pane.scrollTop = tab.pane.scrollHeight;
  }
  function hideThinkingTab(tab) { if (tab.thinkEl) { tab.thinkEl.remove(); tab.thinkEl = null; } }
  function maybeScrollTab(tab, force) {
    const p = tab.pane;
    if (force || (p.scrollHeight - p.scrollTop - p.clientHeight) < 120) p.scrollTop = p.scrollHeight;
  }

  // ---------- AI-GENERATED inline ----------
  const _IMG_EXT = ['png','svg','jpg','jpeg','gif','webp'];
  const _SRC_EXT = ['drawio','d2','excalidraw','pdf','html'];
  function _aigenRelUrl(rawPath) {
    const p = rawPath.replace(/\\/g,'/'); const idx = p.indexOf('AI-GENERATED/');
    if (idx === -1) return null;
    return '/ai-generated/' + p.slice(idx+'AI-GENERATED/'.length).split('/').map(encodeURIComponent).join('/');
  }
  function enrichAIGenerated(bubble) {
    const re = /([A-Za-z]:\\[^\s"'<>)\]]*AI-GENERATED\\[^\s"'<>)\]]+|\/[^\s"'<>)\]]*AI-GENERATED\/[^\s"'<>)\]]+)/g;
    const seen = new Set(); const found = []; let m;
    while ((m = re.exec(bubble.textContent)) !== null) { if (!seen.has(m[1])) { seen.add(m[1]); found.push(m[1]); } }
    found.forEach(path => {
      const url = _aigenRelUrl(path); if (!url) return;
      const ext = path.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'');
      const c = document.createElement('div'); c.style.marginTop='10px';
      if (_IMG_EXT.includes(ext)) {
        const img = document.createElement('img'); img.src=url; img.alt='diagramme';
        img.style.maxWidth='100%'; img.style.borderRadius='8px'; img.style.border='1px solid var(--border)'; img.style.cursor='zoom-in';
        img.addEventListener('click', () => window.open(url,'_blank'));
        const link = document.createElement('a'); link.href=url; link.target='_blank'; link.textContent='🔍 Ouvrir en plein écran';
        link.style.display='inline-block'; link.style.marginTop='4px'; link.style.fontSize='0.8rem';
        c.appendChild(img); c.appendChild(document.createElement('br')); c.appendChild(link); bubble.appendChild(c);
      } else if (_SRC_EXT.includes(ext)) {
        const link = document.createElement('a'); link.href=url; link.target='_blank';
        link.textContent='📎 '+path.split(/[\\/]/).pop()+' (ouvrir)'; link.style.fontSize='0.85rem';
        c.appendChild(link); bubble.appendChild(c);
      }
    });
  }

  // ---------- Input ----------
  function syncInputForActive() {
    const tab = getTab(activeTabId);
    if (!tab) {
      input.disabled = true; sendBtn.disabled = true;
      sendBtn.textContent = 'Envoyer'; sendBtn.classList.remove('stop');
      statusEl.textContent = 'Aucun onglet actif'; return;
    }
    input.disabled = false;
    if (tab.streaming) {
      // During streaming: the button becomes a STOP button (always enabled)
      sendBtn.textContent = '⏹ Stop';
      sendBtn.classList.add('stop');
      sendBtn.disabled = false;
    } else {
      sendBtn.textContent = 'Envoyer';
      sendBtn.classList.remove('stop');
      sendBtn.disabled = (tab.state === 'hot' && !tab.ready);
    }
    input.focus();
  }

  function send() {
    const tab = getTab(activeTabId);
    if (!tab) return;
    const text = input.value.trim();
    if (!text || tab.streaming) return;
    // Warm tab (or lost connection): make it hot first, then queue the send on ready
    if (tab.state !== 'hot' || !tab.ws || tab.ws.readyState !== WebSocket.OPEN || !tab.ready) {
      makeHot(tab);
      tab._pending = text; input.value=''; input.style.height='auto';
      addMsgTab(tab, 'user', text, false, false);
      showThinkingTab(tab);
      tab.streaming = true; syncInputForActive();
      waitReadyThenSend(tab);
      return;
    }
    addMsgTab(tab, 'user', text, false, false);
    tab.ws.send(JSON.stringify({ type:'prompt', text }));
    input.value=''; input.style.height='auto';
    tab.streaming = true; showThinkingTab(tab); syncInputForActive();
  }
  function waitReadyThenSend(tab, tries=0) {
    if (!tab._pending) return;
    if (tab.ready && tab.ws && tab.ws.readyState === WebSocket.OPEN) {
      const text = tab._pending; tab._pending = null;
      tab.ws.send(JSON.stringify({ type:'prompt', text }));
      return;
    }
    if (tries > 40) { tab._pending = null; hideThinkingTab(tab); addMsgTab(tab,'error','Reconnexion impossible.',false,false); tab.streaming=false; syncInputForActive(); return; }
    setTimeout(() => waitReadyThenSend(tab, tries+1), 300);
  }

  // ---------- Events ----------
  function cancelStream() {
    const tab = getTab(activeTabId);
    if (!tab || !tab.streaming) return;
    if (tab.ws && tab.ws.readyState === WebSocket.OPEN) {
      tab.ws.send(JSON.stringify({ type: 'cancel' }));
    }
    // The backend replies with {type:'cancelled'} which finalizes the UI state.
  }
  // Send button doubles as Stop while streaming
  sendBtn.onclick = () => {
    const tab = getTab(activeTabId);
    if (tab && tab.streaming) cancelStream();
    else send();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  input.addEventListener('input', () => { input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,200)+'px'; });
  agentSelect.addEventListener('change', () => {});
  newChatBtn.addEventListener('click', newChat);
  document.getElementById('collapse-btn').addEventListener('click', () => document.body.classList.toggle('sb-collapsed'));

  // keep cursor in input
  document.addEventListener('click', (e) => {
    if (e.target.closest('button, select, a, .session-item, .tab, textarea, input')) return;
    setTimeout(() => { if (!input.disabled) input.focus(); }, 0);
  });
  document.addEventListener('keydown', (e) => {
    if (document.activeElement !== input && !input.disabled && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.length === 1) input.focus();
  });
  // reconnect hot tabs when returning to the page
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    tabs.forEach(t => {
      if (t.state === 'hot' && (!t.ws || t.ws.readyState === WebSocket.CLOSED || t.ws.readyState === WebSocket.CLOSING)) connectTab(t);
    });
  });

  // ---------- Init ----------
  loadSessions();
</script>
